name: GenZ CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
concurrency:
  group: genz-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  unit-build:
    name: Unit + production build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
      - run: npm install
      - name: Run test suite
        shell: bash
        run: |
          set +e
          npm test 2>&1 | tee unit-test.log
          status=${PIPESTATUS[0]}
          exit "$status"
      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: genz-unit-test-diagnostics
          path: unit-test.log
          retention-days: 14
      - name: TypeScript validation
        run: npx tsc --noEmit
      - name: ESLint
        run: npm run lint
      - name: Coverage report
        run: mkdir -p coverage && npm run test:coverage > coverage/unit-coverage.txt 2>&1
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: genz-unit-coverage
          path: coverage/unit-coverage.txt
          retention-days: 14
      - run: npm run build
  mysql-integration:
    name: MySQL integration + concurrency
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: genz_os
          MYSQL_USER: genz_app
          MYSQL_PASSWORD: genz_ci_password
          MYSQL_ROOT_PASSWORD: root_ci_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ugenz_app -pgenz_ci_password --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      GENZ_DB_HOST: 127.0.0.1
      GENZ_DB_PORT: 3306
      GENZ_DB_NAME: genz_os
      GENZ_DB_USER: genz_app
      GENZ_DB_PASSWORD: genz_ci_password
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
      - run: npm install
      - run: npm run db:migrate
      - run: npm run db:migrate
      - run: npm run test:integration
  staging:
    name: Staging destructive + browser E2E
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GENZ_DEPLOYMENT_MODE: staging
      GENZ_TEST_DB_NAME: genz_os
      GENZ_TEST_DB_USER: genz_test
      GENZ_TEST_DB_PASSWORD: genz_test
      GENZ_TEST_MYSQL_ROOT_PASSWORD: genz_test_root
      GENZ_STAFF_INITIAL_PASSWORD: ChangeMe_Test_Only_123!
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
      - run: npm install
      - name: Validate migration and security contracts
        run: |
          npm run test:integrity
          npm run test:qa
      - name: Build and start isolated staging Compose stack
        run: docker compose -f docker-compose.test.yml up -d --build
      - name: Wait for staging health
        shell: bash
        run: |
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:3001/api/health > /tmp/genz-health.json; then
              cat /tmp/genz-health.json
              exit 0
            fi
            sleep 2
          done
          docker compose -f docker-compose.test.yml ps
          docker compose -f docker-compose.test.yml logs --no-color app mysql
          exit 1
      - name: Run complete destructive staging suite
        run: docker compose -f docker-compose.test.yml exec -T app npm run test:staging
      - name: Run browser E2E smoke
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e
      - name: Capture staging diagnostics
        if: always()
        run: |
          docker compose -f docker-compose.test.yml ps > staging-compose-ps.txt || true
          docker compose -f docker-compose.test.yml logs --no-color app mysql > staging-compose.log || true
      - name: Upload staging diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: genz-staging-diagnostics
          path: |
            staging-compose-ps.txt
            staging-compose.log
            playwright-report/
          retention-days: 14
      - name: Stop staging stack
        if: always()
        run: docker compose -f docker-compose.test.yml down -v
  docker:
    name: Docker build + Compose validation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose configuration
        env:
          GENZ_DB_PASSWORD: genz_ci_password
          MYSQL_ROOT_PASSWORD: root_ci_password
          GENZ_STAFF_INITIAL_PASSWORD: ci_initial_password
        run: docker compose config --quiet
      - name: Build production image
        run: docker build --tag genz-os:ci .
  security:
    name: Dependency + security checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
      - run: npm install
      - name: Dependency audit
        run: |
          mkdir -p security
          npm audit --json > security/npm-audit.json || true
          npm audit --audit-level=high
      - name: Package signature/provenance audit
        run: npm audit signatures > security/npm-signatures.txt || true
      - name: Source security contract checks
        shell: bash
        run: |
          set +e
          npm run test:qa 2>&1 | tee security/qa-contracts.log
          status=${PIPESTATUS[0]}
          exit "$status"
      - name: Upload security diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: genz-security-diagnostics
          path: security/
          retention-days: 14
